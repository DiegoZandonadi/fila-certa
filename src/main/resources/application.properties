spring.application.name=fila-certa
server.port=${PORT:8080}

# ---------- Banco (H2 em memoria; os dados "pre-existentes" sao gerados pelo DataSeeder) ----------
spring.datasource.url=jdbc:h2:mem:filacerta;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---------- Relogio da aplicacao ----------
# 1 = tempo real. 10 = cada segundo real vale 10 segundos no app (ideal para demonstracao/video)
filacerta.relogio.fator=10

# ---------- Simulador de movimento (clientes chegando, guiches atendendo) ----------
filacerta.simulacao.habilitada=true
filacerta.simulacao.intervalo-ms=2000

# ---------- Integracao com o BOT de suporte (feito pelo colega) ----------
# Deixe a URL em branco para usar o assistente local (regras). Quando o bot estiver pronto:
#   filacerta.bot.url=http://localhost:5005/chat
filacerta.bot.url=
filacerta.bot.api-key=
filacerta.bot.timeout-ms=4000

logging.level.org.hibernate.SQL=warn
