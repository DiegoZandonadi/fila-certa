spring.application.name=fila-certa
server.port=${PORT:8080}

# ---------- Banco (H2 em memoria; os dados "pre-existentes" sao gerados pelo DataSeeder) ----------
spring.datasource.url=jdbc:h2:mem:filacerta;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=5000
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---------- Relogio da aplicacao ----------
# 1 = tempo real. 10 = cada segundo real vale 10 segundos no app (ideal para demonstracao/video)
filacerta.relogio.fator=10

# ---------- Simulador de movimento (clientes chegando, guiches atendendo) ----------
filacerta.simulacao.habilitada=true
filacerta.simulacao.intervalo-ms=2000

# ---------- Integracao com o BOT de suporte (public-services-support-agent, do grupo) ----------
# API FastAPI do bot: POST /chat {"message": "..."} -> {"category": "...", "answer": "..."}.
# Se o bot nao estiver no ar, o app cai sozinho no assistente local. Deixe em branco para desativar.
filacerta.bot.url=http://127.0.0.1:6969/chat
filacerta.bot.api-key=
filacerta.bot.timeout-ms=4000

logging.level.org.hibernate.SQL=warn

# Sempre revalida os arquivos do front-end (evita ver versao antiga em cache)
spring.web.resources.cache.cachecontrol.no-cache=true

# ---------- Limites para nada ficar pendurado: falha rapido em vez de travar ----------
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=5000
spring.transaction.default-timeout=15
